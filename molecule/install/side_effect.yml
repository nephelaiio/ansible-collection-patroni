---
- name: Import configuration playbook
  ansible.builtin.import_playbook: nephelaiio.patroni.configure

- name: Manage pgpass file
  hosts: _patroni_cluster_master
  become: true
  vars_files:
    - ../../playbooks/vars/main.yml
  tasks:
    - name: Include virtualenv tasks
      ansible.builtin.include_tasks: ../../playbooks/tasks/virtualenv.yml
      vars:
        patroni_virtualenv_manage: true

    - name: Verify install tasks
      block:
        - name: Safely execute postgresql query command without authentication
          block:
            - name: Attempt postgresql query without authentication
              community.postgresql.postgresql_query:
                login_db: "{{ patroni_molecule_database }}"
                login_port: "{{ _patroni_haproxy_port_psql_master_local }}"
                login_user: "{{ patroni_molecule_username }}"
                login_host: 127.0.0.1
                query: SELECT * FROM pg_catalog.pg_database;
              become: true
              become_user: "{{ _postgresql_user }}"
              register: _postgresql_query_result

          rescue:
            - name: Verify postgresql query without authentication
              ansible.builtin.assert:
                that: _query is search('no password supplied')
              vars:
                _query: "{{ _postgresql_query_result.msg | default('') }}"

        - name: Run psql command with pgpassfile
          community.postgresql.postgresql_query:
            login_db: "{{ patroni_molecule_database }}"
            login_port: "{{ _patroni_haproxy_port_psql_master_local }}"
            login_user: "{{ patroni_molecule_username }}"
            login_host: 127.0.0.1
            query: SELECT * FROM pg_catalog.pg_database;
            connect_params:
              passfile: "{{ _patroni_cluster_pgpass_path }}"
          become: true
          become_user: "{{ _postgresql_user }}"
          register: _postgresql_query_result

        - name: Verify postgresql query with pgpass
          ansible.builtin.assert:
            that: (not _failed | bool) and (_query_result | length > 0)
          vars:
            _query: "{{ _postgresql_query_result | default({}) }}"
            _failed: "{{ _query.failed | default('false') }}"
            _query_result: "{{ _query.query_result | default([]) }}"

      always:
        - name: Include virtualenv tasks
          ansible.builtin.include_tasks: ../../playbooks/tasks/virtualenv.yml
          vars:
            patroni_virtualenv_manage: false

- name: Import pgcron playbook
  ansible.builtin.import_playbook: nephelaiio.patroni.pgcron

- name: Verify pg_cron settings
  hosts: _patroni_cluster_master
  become: true
  vars_files:
    - ../../playbooks/vars/main.yml
  tasks:
    - name: Include virtualenv tasks
      ansible.builtin.include_tasks: ../../playbooks/tasks/virtualenv.yml
      vars:
        patroni_virtualenv_manage: true

    - name: Verify pg cron tasks
      block:
        - name: Wait for pg_cron executions
          ansible.builtin.pause:
            seconds: 60

        - name: Query existing pg_cron
          community.postgresql.postgresql_query:
            login_port: "{{ _patroni_haproxy_port_psql_master_local }}"
            query: "SELECT * FROM cron.job;"
          become: true
          become_user: "{{ _postgresql_user }}"
          register: _patroni_pgcron_results

        - name: Query running pg_cron jobs
          community.postgresql.postgresql_query:
            login_port: "{{ _patroni_haproxy_port_psql_master_local }}"
            query: "SELECT * FROM cron.job_run_details order by start_time;"
          become: true
          become_user: "{{ _postgresql_user }}"
          register: _patroni_pgcron_running

        - name: Verify pg_cron jobs
          ansible.builtin.assert:
            that:
              - (_created | length) == (_present | length)
              - _running | length > 0
          vars:
            _default:
              active: true
              database: postgres
              state: present
            _pg_cron: "{{ _patroni_cluster_pg_cron_jobs | sort(attribute='job_name') }}"
            _pg_cron_defaults: "{{ [_default] | product(_pg_cron) | map('combine') }}"
            _existing: "{{ _patroni_pgcron_results.query_result | default([]) }}"
            _present: "{{ _pg_cron_defaults | selectattr('state', 'equalto', 'present') }}"
            _existing_names: "{{ _existing | map(attribute='jobname') }}"
            _created: "{{ _present | selectattr('job_name', 'in', _existing_names) }}"
            _running: "{{ _patroni_pgcron_running.query_result | default([]) }}"

      always:
        - name: Include virtualenv tasks
          ansible.builtin.include_tasks: ../../playbooks/tasks/virtualenv.yml
          vars:
            patroni_virtualenv_manage: false

- name: Override pg_cron jobs
  hosts: all
  vars_files:
    - ../../playbooks/vars/main.yml
  tasks:
    - name: Override pg_cron settings
      ansible.builtin.set_fact:
        patroni_cluster_pg_cron_jobs:
          - job_name: molecule
            schedule: "30 seconds"
            command: "SELECT 1"
            active: false
          - job_name: test
            schedule: "10 3 * * 6"
            command: "SELECT 1"
            state: absent
          - job_name: inventory
            schedule: "30 3 * * 6"
            command: "SELECT 1"

- name: Import pgcron playbook
  ansible.builtin.import_playbook: nephelaiio.patroni.pgcron

- name: Verify materialized view settings
  hosts: _patroni_cluster_master
  become: true
  vars_files:
    - ../../playbooks/vars/main.yml
  tasks:
    - name: Include virtualenv tasks
      ansible.builtin.include_tasks: ../../playbooks/tasks/virtualenv.yml
      vars:
        patroni_virtualenv_manage: true

    - name: Verify mview tasks
      block:
        - name: Query existing databases
          community.postgresql.postgresql_query:
            login_port: "{{ _patroni_haproxy_port_psql_master_local }}"
            query: SELECT datname FROM pg_database WHERE datallowconn;
            login_db: "postgres"
          become: true
          become_user: "{{ _postgresql_user }}"
          register: _patroni_databases_results
          no_log: "{{ _patroni_nolog }}"

        - name: Query existing patroni views
          community.postgresql.postgresql_query:
            login_port: "{{ _patroni_haproxy_port_psql_master_local }}"
            query: "SELECT * FROM pg_matviews;"
            login_db: "{{ item }}"
          vars:
            _databases: "{{ _patroni_databases_results.query_result | default([]) }}"
            _db_names: "{{ _databases | map(attribute='datname') | flatten }}"
          loop: "{{ _db_names }}"
          become: true
          become_user: "{{ _postgresql_user }}"
          register: _patroni_view_results
          no_log: "{{ _patroni_nolog }}"

        - name: Set existing materialized view query fact
          ansible.builtin.set_fact:
            _patroni_query_views: "{{ _query_result }}"
          vars:
            _results: "{{ _patroni_view_results.results | default([]) }}"
            _query_result: "{{ _results | selectattr('query_result') }}"

        - name: Build patroni view facts
          ansible.builtin.set_fact:
            _patroni_existing_views: "{{ _existing_views }}"
            _patroni_views_overwritten: "{{ _view_defaults }}"
          vars:
            _attrs:
              - state
            _regex: "AS \\\"\\?column\\?\\\";"
            _existing: "{{ _patroni_query_views | sort(attribute='item') }}"
            _dbs: "{{ _existing | map(attribute='item') }}"
            _dbs_dict: "{{ _dbs | map(_to_dict, 'login_db') | map(_cons) }}"
            _query_results: "{{ _existing | map(attribute='query_result') }}"
            _mview: "{{ _query_results | map('map', attribute='matviewname') }}"
            _mview_dict: "{{ _mview | map('map', _to_dict, 'name') }}"
            _mviews_overwritten: "{{ _mview_dict | zip(_dbs_dict) | map(_pairs) | map('map', 'combine') }}"
            _schemas: "{{ _query_results | map('map', attribute='schemaname') }}"
            _schemas_dict: "{{ _schemas | map('map', _to_dict, 'schema') }}"
            _schemas_overwritten: "{{ _mviews_overwritten | zip(_schemas_dict) | map(_pairs) | map('map', 'combine') }}"
            _queries: "{{ _query_results | map('map', attribute='definition') | map('map', 'regex_replace', _regex, '') | map('map', 'trim') }}"
            _queries_dict: "{{ _queries | map('map', _to_dict, 'query') }}"
            _existing_views: "{{ _schemas_overwritten | zip(_queries_dict) | map(_pairs) | map('map', 'combine') | flatten }}"
            _existing_view_queries: "{{ _existing_views | map(attribute='query') | map('trim') }}"
            _existing_view_queries_dict: "{{ _existing_view_queries | map(_to_dict, 'query') }}"
            _existing_view_queries_overwritten: "{{ _existing_views | zip(_existing_view_queries_dict) | map('combine') | map(_drop_attrs, _attrs) }}"
            _patroni_view_list: "{{ _patroni_cluster_views | dict2items }}"
            _default:
              schema: public
              login_db: postgres
            _views: "{{ _patroni_view_list | sort(attribute='key') }}"
            _keys: "{{ _views | map(attribute='key') }}"
            _names: "{{ _keys | map(_to_dict, 'name') }}"
            _value: "{{ _views | map(attribute='value') }}"
            _value_defaults: "{{ [_default] | product(_value) | map('combine') }}"
            _view_defaults: "{{ _names | zip(_value_defaults) | map('combine') }}"

        - name: Debug target materialized views
          ansible.builtin.debug:
            var: _patroni_views_overwritten

        - name: Debug existing materialized views
          ansible.builtin.debug:
            var: _patroni_existing_views

        - name: Verify materialized view creation tasks
          ansible.builtin.assert:
            that: (_patroni_existing_views | length) == (_patroni_views_overwritten | length)

      always:
        - name: Include virtualenv tasks
          ansible.builtin.include_tasks: ../../playbooks/tasks/virtualenv.yml
          vars:
            patroni_virtualenv_manage: false

- name: Override materialized views
  hosts: all
  vars_files:
    - ../../playbooks/vars/main.yml
  tasks:
    - name: Override view settings
      ansible.builtin.set_fact:
        patroni_cluster_views:
          view_test:
            query: |
              SELECT 1
            login_db: "{{ patroni_molecule_database }}"

- name: Import configuration playbook
